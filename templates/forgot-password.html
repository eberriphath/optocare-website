<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Forgot Password</title>

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

<style>
.container{
    max-width:400px;
    margin:120px auto;
    background:white;
    padding:40px;
    border-radius:12px;
    box-shadow:0 4px 15px rgba(0,0,0,0.05);
}

input{
    width:100%;
    padding:12px;
    margin-top:15px;
    border:1px solid #ddd;
    border-radius:8px;
}

button{
    width:100%;
    padding:12px;
    margin-top:20px;
    background:#1e3a8a;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
}
</style>

</head>
<body>

<div class="container">

<h2>Forgot Password</h2>

<form method="POST">

<input
type="email"
name="email"
placeholder="Enter your email"
required
>

<button type="submit">
Send Reset Link
</button>

</form>

</div>

</body>
</html>
