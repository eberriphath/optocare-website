<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Reset Password</title>

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

<style>
.container{
    max-width:400px;
    margin:120px auto;
    background:white;
    padding:40px;
    border-radius:12px;
    box-shadow:0 4px 15px rgba(0,0,0,0.05);
}

.password-box{
    position:relative;
}

input{
    width:100%;
    padding:12px;
    margin-top:15px;
    border:1px solid #ddd;
    border-radius:8px;
}

.eye{
    position:absolute;
    right:15px;
    top:28px;
    cursor:pointer;
    font-size:14px;
}

button{
    width:100%;
    padding:12px;
    margin-top:20px;
    background:#1e3a8a;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
}
</style>

</head>
<body>

<div class="container">

<h2>Reset Password</h2>

<form method="POST">

<div class="password-box">

<input
type="password"
name="password"
id="password"
placeholder="New Password"
required
>

<span class="eye" onclick="togglePassword()">
👁
</span>

</div>

<button type="submit">
Reset Password
</button>

</form>

</div>

<script>
function togglePassword() {

    const passwordInput =
    document.getElementById("password");

    if (passwordInput.type === "password") {
        passwordInput.type = "text";
    } else {
        passwordInput.type = "password";
    }
}
</script>

</body>
</html>
