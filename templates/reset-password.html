<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<title>Reset Password</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='style.css') }}">

<style>

.container{
    max-width:400px;
    margin:120px auto;
    background:white;
    padding:40px;
    border-radius:12px;
    box-shadow:0 4px 15px rgba(0,0,0,0.05);
}

.password-box{
    position:relative;
    margin-top:15px;
}

input{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:8px;
    box-sizing:border-box;
}

.eye{
    position:absolute;
    right:15px;
    top:14px;
    cursor:pointer;
    font-size:14px;
}

button{
    width:100%;
    padding:12px;
    margin-top:20px;
    background:#1e3a8a;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

.password-rules{
    margin-top:15px;
    font-size:13px;
    color:#666;
}

.password-rules ul{
    padding-left:18px;
}

</style>

</head>

<body>

<div class="container">

<h2>Reset Password</h2>

<form method="POST">

<!-- NEW PASSWORD -->

<div class="password-box">

<input
type="password"
name="password"
id="password"
placeholder="New Password"
required
>

<span
class="eye"
onclick="togglePassword('password')">

👁

</span>

</div>


<!-- CONFIRM PASSWORD -->

<div class="password-box">

<input
type="password"
name="confirm_password"
id="confirm_password"
placeholder="Confirm Password"
required
>

<span
class="eye"
onclick="togglePassword('confirm_password')">

👁

</span>

</div>


<div class="password-rules">

Password requirements:

<ul>
<li>Minimum 12 characters</li>
<li>1 uppercase letter</li>
<li>1 lowercase letter</li>
<li>1 number</li>
<li>1 special character</li>
</ul>

</div>


<button type="submit">

Reset Password

</button>

</form>

</div>


<script>

function togglePassword(fieldId){

    const input =
    document.getElementById(fieldId);

    if(input.type === "password"){

        input.type = "text";

    }else{

        input.type = "password";

    }

}

</script>

</body>
</html>
