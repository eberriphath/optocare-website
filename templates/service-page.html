<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>{{ service.title }}</title>

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

<style>

body{
    font-family:Poppins,sans-serif;
    background:#f5f5f5;
    margin:0;
}

.service-hero{
    padding:60px 20px;
    text-align:center;
    background:white;
}

.service-hero h1{
    font-size:42px;
    margin-bottom:10px;
}

.service-hero p{
    color:#555;
    max-width:700px;
    margin:auto;
}

.gallery{
    max-width:1200px;
    margin:40px auto;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
    gap:20px;
    padding:20px;
}

.gallery img{
    width:100%;
    height:320px;
    object-fit:cover;
    border-radius:16px;
    box-shadow:0 4px 15px rgba(0,0,0,0.08);
    transition:0.3s ease;
}

.gallery img:hover{
    transform:scale(1.03);
}

.back-btn{
    display:inline-block;
    margin-top:30px;
    background:#1e3a8a;
    color:white;
    padding:12px 20px;
    border-radius:8px;
    text-decoration:none;
}

.back-btn:hover{
    background:#172554;
}

</style>
</head>
<body>

<section class="service-hero">

    <h1>{{ service.title }}</h1>

    <p>{{ service.description }}</p>

    <a href="{{ url_for('home') }}" class="back-btn">
        Back Home
    </a>

</section>

<section class="gallery">

    {% for image in service.images %}

        <img src="{{ url_for('static', filename='images/' + image) }}">

    {% endfor %}

</section>

</body>
</html>
