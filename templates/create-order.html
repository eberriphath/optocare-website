<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Optical Order Form</title>

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

<style>

body{
    font-family: Arial, sans-serif;
    background: #f3f4f6;
    padding: 40px;
}

/* MAIN SHEET */
.form-sheet{
    width: 950px;
    margin: auto;
    background: white;
    padding: 30px;
    border: 2px solid #111827;
    border-radius: 10px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.08);
}

/* TITLE */
h2{
    text-align: center;
    margin-bottom: 25px;
    font-size: 28px;
    letter-spacing: 2px;
    color: #111827;
}

/* TABLES */
table{
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 25px;
}

td,
th{
    border: 1px solid #111827;
    padding: 10px;
    font-size: 14px;
}

th{
    background: #e5e7eb;
    text-align: center;
    font-weight: bold;
}

/* SECTION HEADERS */
.section-title td{
    background: #111827;
    color: white;
    font-weight: bold;
    text-align: center;
    letter-spacing: 1px;
    padding: 12px;
}

/* INPUTS */
input{
    width: 100%;
    border: none;
    outline: none;
    font-size: 14px;
    background: transparent;
    padding: 4px;
}

/* INPUT HOVER FEEL */
td:focus-within{
    background: #f9fafb;
}

/* BUTTON */
.submit-btn{
    width: 100%;
    padding: 15px;
    background: #111827;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
    font-weight: bold;
    letter-spacing: 1px;
    transition: 0.3s;
}

.submit-btn:hover{
    background: #1e3a8a;
    transform: translateY(-1px);
}

/* RESPONSIVE */
@media(max-width: 1000px){

    .form-sheet{
        width: 100%;
        padding: 15px;
    }

    body{
        padding: 10px;
    }

    td,
    th{
        font-size: 12px;
        padding: 6px;
    }

    h2{
        font-size: 22px;
    }
}

</style>
</head>

<body>

<div class="form-sheet">

<h2>OPTICAL ORDER FORM</h2>

<form method="POST">

<!-- CLIENT INFO -->
<table>

<tr class="section-title">
    <td colspan="6">CLIENT INFORMATION</td>
</tr>

<tr>
    <td><strong>Order No</strong></td>
    <td><input type="text" name="order_number"></td>

    <td><strong>Date</strong></td>
    <td><input type="date" name="date"></td>
</tr>

<tr>
    <td><strong>Name</strong></td>
    <td colspan="3">
        <input type="text" name="name">
    </td>

    <td><strong>Phone</strong></td>
    <td><input type="text" name="phone"></td>
</tr>

<tr>
    <td><strong>DOB</strong></td>
    <td><input type="date" name="dob"></td>

    <td colspan="4"></td>
</tr>

</table>


<!-- PRESCRIPTION -->
<table>

<tr class="section-title">
    <td colspan="7">PRESCRIPTION</td>
</tr>

<tr>
    <th></th>
    <th>SPH</th>
    <th>CYL</th>
    <th>AXIS</th>
    <th>ADD</th>
    <th>PD</th>
</tr>

<tr>
    <td><strong>RIGHT</strong></td>

    <td><input type="text" name="right_sph"></td>

    <td><input type="text" name="right_cyl"></td>

    <td><input type="text" name="right_axis"></td>

    <td><input type="text" name="right_add"></td>

    <td><input type="text" name="right_pd"></td>
</tr>

<tr>
    <td><strong>LEFT</strong></td>

    <td><input type="text" name="left_sph"></td>

    <td><input type="text" name="left_cyl"></td>

    <td><input type="text" name="left_axis"></td>

    <td><input type="text" name="left_add"></td>

    <td><input type="text" name="left_pd"></td>
</tr>

</table>


<!-- FRAME DETAILS -->
<table>

<tr class="section-title">
    <td colspan="6">FRAME DETAILS</td>
</tr>

<tr>
    <td><strong>Make</strong></td>
    <td><input type="text" name="frame_make"></td>

    <td><strong>Model</strong></td>
    <td><input type="text" name="frame_model"></td>

    <td><strong>Size</strong></td>
    <td><input type="text" name="frame_size"></td>
</tr>

<tr>
    <td><strong>Color</strong></td>
    <td><input type="text" name="tint"></td>

    <td colspan="4"></td>
</tr>

</table>


<!-- LENS DETAILS -->
<table>

<tr class="section-title">
    <td colspan="6">LENS DETAILS</td>
</tr>

<tr>
    <td><strong>Lens Type</strong></td>
    <td><input type="text" name="lens_type"></td>

    <td><strong>Coating</strong></td>
    <td><input type="text" name="coating"></td>

    <td><strong>Base Curve</strong></td>
    <td><input type="text" name="base_curve"></td>
</tr>

</table>


<!-- 🔥 NEW SECTION: REMARKS -->
<table>

<tr class="section-title">
    <td colspan="6">REMARKS</td>
</tr>

<tr>
    <td colspan="6">
        <input type="text" name="remarks" placeholder="Any special instructions or notes...">
    </td>
</tr>

</table>


<button class="submit-btn" type="submit">
    SUBMIT ORDER
</button>

</form>

</div>

</body>
</html>
