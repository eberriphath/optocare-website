<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Optocare</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <style>

        body{
            font-family: 'Poppins', sans-serif;
            background: #f3f4f6;
        }

        .login-container {
            max-width: 420px;
            margin: 120px auto;
            background: white;
            padding: 40px;
            border-radius: 14px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
        }

        .login-container h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #111827;
        }

        .login-form input {
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid #d1d5db;
            font-size: 15px;
            transition: 0.3s;
            box-sizing: border-box;
        }

        .login-form input:focus{
            border-color: #1e3a8a;
            box-shadow: 0 0 0 3px rgba(30,58,138,0.1);
            outline: none;
        }

        .password-box{
            position: relative;
        }

        .password-box input{
            padding-right: 50px;
        }

        .toggle-password{
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            user-select: none;
            font-size: 18px;
        }

        .login-form button {
            width: 100%;
            background: #1e3a8a;
            color: white;
            padding: 14px;
            border: none;
            border-radius: 8px;
            margin-top: 18px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            transition: 0.3s;
        }

        .login-form button:hover {
            background: #172554;
        }

        .extra {
            text-align: center;
            margin-top: 18px;
            font-size: 14px;
        }

        .extra a {
            color: #f97316;
            text-decoration: none;
            font-weight: 500;
        }

    </style>
</head>

<body>

<nav class="navbar">
    <h2 class="logo">Optocare</h2>
</nav>

<div class="login-container">

    <h2>Login</h2>

    <form class="login-form" method="POST" action="{{ url_for('login') }}">

        <input 
            type="email" 
            name="email" 
            placeholder="Email" 
            required
        >

        <div class="password-box">

            <input 
                type="password"
                id="password"
                name="password"
                placeholder="Password"
                required
            >

            <span class="toggle-password" onclick="togglePassword()">
                👁
            </span>

        </div>

        <button type="submit">
            Login
        </button>

    </form>

    <div class="extra">
        <p>
            Don't have an account?
            <a href="{{ url_for('signup') }}">
                Apply here
            </a>
        </p>
    </div>

</div>

<script>

function togglePassword(){

    const passwordInput = document.getElementById("password");

    if(passwordInput.type === "password"){
        passwordInput.type = "text";
    } else {
        passwordInput.type = "password";
    }
}

</script>

</body>
</html>
